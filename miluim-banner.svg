<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="190" viewBox="0 0 1536 190" role="img" aria-labelledby="title desc">
<title id="title">עסק של מילואימניק לפניך</title>
<desc id="desc">באנר תמיכה בעסקים של משרתי מילואים</desc>
<rect width="1536" height="190" fill="#f4f1e8"/>
<defs>
  <linearGradient id="twelve" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2899d4"/>
    <stop offset="0.28" stop-color="#32a852"/>
    <stop offset="0.5" stop-color="#f1c40f"/>
    <stop offset="0.72" stop-color="#f39c12"/>
    <stop offset="1" stop-color="#d71920"/>
  </linearGradient>
</defs>

<!-- Main Hebrew message -->
<g fill="#56652b" font-family="Arial, sans-serif" font-weight="700" text-anchor="end">
  <text x="1495" y="83" font-size="58">עסק של מילואימניק לפניך!</text>
  <text x="1495" y="145" font-size="48">אם קונים - או מעסיק במילואים</text>
</g>

<!-- Colorful 12 mark -->
<g transform="translate(325 33)">
  <text x="0" y="98" font-family="Arial, sans-serif" font-size="102" font-weight="700" fill="url(#twelve)">12</text>
</g>

<!-- Israeli flag -->
<g transform="translate(450 43) rotate(5 62 45)">
  <rect x="0" y="0" width="128" height="86" rx="2" fill="#fff" stroke="#d7d7d7"/>
  <rect x="0" y="10" width="128" height="10" fill="#2f5fb3"/>
  <rect x="0" y="66" width="128" height="10" fill="#2f5fb3"/>
  <polygon points="64,28 51,51 77,51" fill="none" stroke="#2f5fb3" stroke-width="3"/>
  <polygon points="64,58 51,35 77,35" fill="none" stroke="#2f5fb3" stroke-width="3"/>
</g>

<!-- Reserve-support emblem -->
<g transform="translate(185 23)">
  <polygon points="58,0 116,116 0,116" fill="none" stroke="#7d8052" stroke-width="4"/>
  <circle cx="58" cy="44" r="12" fill="#6b772d"/>
  <path d="M33 77 Q58 55 83 77 L83 89 L33 89 Z" fill="#6b772d"/>
  <path d="M38 72 Q58 96 78 72" fill="none" stroke="#6b772d" stroke-width="5"/>
  <text x="58" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5d6335">מחבקים</text>
  <text x="58" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#5d6335">מילואימניקים</text>
</g>
</svg>